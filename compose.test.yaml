services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: itsm_test
      POSTGRES_USER: itsm_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-local-test-only}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm_test -d itsm_test"]
      interval: 5s
      timeout: 3s
      retries: 15
