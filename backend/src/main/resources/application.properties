spring.application.name=itsm
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itsm}
spring.datasource.username=${DB_USER:itsm}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
itsm.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
itsm.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
itsm.intelligence.url=${INTELLIGENCE_URL:}
itsm.intelligence.token=${INTELLIGENCE_TOKEN:}
itsm.scheduling.enabled=${SCHEDULING_ENABLED:true}
itsm.sla.poll-ms=30000
